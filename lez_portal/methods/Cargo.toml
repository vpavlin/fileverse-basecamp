# The guest, for `cargo risczero build` / scripts/build-guest.sh. Not a workspace member.
[package]
name = "portal-methods"
version = "0.1.0"
edition = "2021"

[workspace]

[build-dependencies]
risc0-build = "=3.0.5"

[dependencies]
risc0-zkvm = { version = "=3.0.5", features = ["std"] }

[package.metadata.risc0]
methods = ["guest"]
