[package]
name = "fileverse_core"
version = "0.3.0"
edition = "2021"

# Standalone crate: the empty table keeps cargo from adopting a parent workspace.
[workspace]

[lib]
# staticlib for the Logos plugin, rlib for the CLI and the tests.
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "fvview"
path = "src/bin/fvview.rs"
required-features = ["cli"]

# Cargo.lock is committed; the builder feeds it to buildRustPackage. To
# regenerate it after changing dependencies, stage the SDK the path dep below
# points at, then resolve against it:
#   nix build github:logos-co/logos-module-builder#rust-sdk-src -o logos-rust-sdk-src
#   (cd rust-lib && cargo generate-lockfile)

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls (pure-Rust TLS) like eth_rpc_module, so no OpenSSL in the closure.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "blocking", "json", "multipart"] }
yrs = "0.21"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
sha3 = "0.10"
hkdf = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
argon2 = "0.5"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
aes-gcm = "0.10"
crypto_secretbox = "0.1"
k256 = { version = "0.13", features = ["ecdh"] }
rsa = { version = "0.9", features = ["sha2"] }
flate2 = "1"
pulldown-cmark = { version = "0.12", default-features = false }
rand = "0.8"

logos-rust-sdk = { path = "../logos-rust-sdk-src", optional = true }

[features]
default = ["logos_module"]
logos_module = ["dep:logos-rust-sdk"]
# The fvview CLI: the same engine against a plain JSON-RPC endpoint, for tests and debugging.
cli = []

[profile.release]
opt-level = 3
