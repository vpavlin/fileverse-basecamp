[package]
name = "portal_core"
version = "0.1.0"
edition = "2021"
description = "Fileverse portal on LEZ: actor state, messages, events and address derivation."

[dependencies]
# Not `workspace = true` for the guest-facing crates: that would pull the `host` feature
# into the guest build.
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3" }
borsh = { version = "1.5", features = ["derive"] }
risc0-zkvm = { version = "=3.0.5", default-features = false }
serde = { version = "1.0", features = ["derive"] }
# Inert #[message] / #[state] markers that make `spel generate-idl` find the IDL's types.
spel-attrs = { git = "https://github.com/logos-co/spel.git", rev = "d7444f84cabee3371aca3bdee8ebc4c2fc45ebde" }
